# Create directories for clickhouse-watcherd
# See tmpfiles.d(5) for details

# Runtime directory for socket
d /var/run/clickhouse-watcher 0755 clickhouse_watcher clickhouse_watcherd -

# State directory for RRD data
d /var/lib/clickhouse-watcher 0750 clickhouse_watcher clickhouse_watcherd -

# Configuration directory
d /etc/clickhouse-watcher 0755 root root -
