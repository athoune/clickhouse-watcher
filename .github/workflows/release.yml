name: Release

on:
  push:
    tags:
      - "v*"
      - "V*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Build all platforms
        run: make dist

      - name: Build Debian packages
        env:
          SOCKET_PATH: /run/clickhouse-watcher/clickhouse-watcher.sock
        run: make deb

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./dist/archives/clickhouse-watcher-${{ github.ref_name }}-darwin-amd64.tar.gz
            ./dist/archives/clickhouse-watcher-${{ github.ref_name }}-darwin-arm64.tar.gz
            ./dist/archives/clickhouse-watcher-${{ github.ref_name }}-linux-amd64.tar.gz
            ./dist/archives/clickhouse-watcher-${{ github.ref_name }}-linux-arm64.tar.gz
            ./dist/archives/*.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
