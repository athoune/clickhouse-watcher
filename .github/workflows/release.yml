name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Build all platforms
        run: make dist

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        permissions: write-all
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false

      - name: Upload macOS AMD64
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/archives/clickhouse-watcher-${{ github.ref_name }}-darwin-amd64.tar.gz
          asset_name: clickhouse-watcher-${{ github.ref_name }}-darwin-amd64.tar.gz
          asset_content_type: application/gzip

      - name: Upload macOS ARM64
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/archives/clickhouse-watcher-${{ github.ref_name }}-darwin-arm64.tar.gz
          asset_name: clickhouse-watcher-${{ github.ref_name }}-darwin-arm64.tar.gz
          asset_content_type: application/gzip

      - name: Upload Linux AMD64
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/archives/clickhouse-watcher-${{ github.ref_name }}-linux-amd64.tar.gz
          asset_name: clickhouse-watcher-${{ github.ref_name }}-linux-amd64.tar.gz
          asset_content_type: application/gzip

      - name: Upload Linux ARM64
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/archives/clickhouse-watcher-${{ github.ref_name }}-linux-arm64.tar.gz
          asset_name: clickhouse-watcher-${{ github.ref_name }}-linux-arm64.tar.gz
          asset_content_type: application/gzip

      - name: Build Debian packages
        env:
          SOCKET_PATH: /run/clickhouse-watcher/clickhouse-watcher.sock
        run: make deb

      - name: Upload Debian AMD64
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/archives/clickhouse-watcher_${{ github.ref_name }}_amd64.deb
          asset_name: clickhouse-watcher_${{ github.ref_name }}_amd64.deb
          asset_content_type: application/vnd.debian.binary-package

      - name: Upload Debian ARM64
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/archives/clickhouse-watcher_${{ github.ref_name }}_arm64.deb
          asset_name: clickhouse-watcher_${{ github.ref_name }}_arm64.deb
          asset_content_type: application/vnd.debian.binary-package
