services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse-watcher-test
    hostname: localhost
    ports:
      - "127.0.0.1:8124:8123"
      - "127.0.0.1:9001:9000"
    environment:
      CLICKHOUSE_DB: test
      CLICKHOUSE_USER: test
      CLICKHOUSE_PASSWORD: test123
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10
